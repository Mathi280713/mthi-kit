.field { min-width: 0; }

.cardref { position: absolute; left: 90px; top: 14px; border: 2px dashed var(--accent); border-radius: 8px; display: grid; place-items: center; text-align: center; color: var(--accent); font-size: 12px; font-weight: 700; background: var(--accent-soft); }
